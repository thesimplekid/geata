[workspace]
members = ["crates/geata"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
bitcoin = "0.32"
lightning-invoice = "0.34.1"
prost = "0.14"
http-body-util = "0.1"
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
bytes = "1"
cdk = { version = "=0.18.0", default-features = false, features = ["wallet", "nostr"] }
cdk-sqlite = { version = "=0.18.0", default-features = false, features = ["wallet"] }
redb = "4.2"
clap = { version = "4", features = ["derive", "env"] }
http = "1"
httpdate = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring", "rustls-platform-verifier"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
nostr-sdk = { version = "0.44.1", default-features = false, features = ["nip59"] }
openssl = "0.10"
parking_lot = "0.12"
pingora = { version = "0.9.0", default-features = false, features = ["proxy", "openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tungstenite = "0.26.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
